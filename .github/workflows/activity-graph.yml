# .github/workflows/activity-graph.yml
name: Generate Activity Graph
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Ashutosh00710/github-readme-activity-graph@v2.0.0
        with:
          github-username: jude-uloko
          output: github-activity-graph.svg
          theme: github-compact
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-activity-graph.svg
          git commit -m "Update activity graph" || exit 0
          git push